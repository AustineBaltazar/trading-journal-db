name: Deploy to EC2

on:
  push:
    branches: [main]

# One deploy at a time from this repo
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Both repos deploy the same containers: the lock makes a second deploy wait
          # for the first instead of colliding. "up --build" only restarts what changed,
          # so the database keeps running.
          script: |
            flock -w 900 /tmp/mnq-journal-deploy.lock bash -ec '
              cd ~/trading-journal && git pull origin main
              cd ~/trading-journal-frontend && git pull origin main
              cd ~/trading-journal && docker compose up -d --build --remove-orphans
            '
