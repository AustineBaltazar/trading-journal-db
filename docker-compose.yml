services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 52425978qw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: trading_journal
      DB_USER: postgres
      DB_PASSWORD: 52425978qw
      JWT_SECRET: some_long_random_string_nobody_could_guess_12345
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    build: ../trading-journal-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
