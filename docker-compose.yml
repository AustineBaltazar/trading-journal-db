services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: trading_journal
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      IMAGES_BUCKET: ${IMAGES_BUCKET:-}
      APP_ORIGINS: ${APP_ORIGINS:-https://bro-trading.duckdns.org}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-brotradingjournal@gmail.com}
      APP_URL: ${APP_URL:-https://bro-trading.duckdns.org}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-MNQ Journal <brotradingjournal@gmail.com>}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - db

  frontend:
    build: ../trading-journal-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
